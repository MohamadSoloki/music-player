name: Release

# Two ways to build a new version:
# 1) Actions tab > Release > Run workflow, then type the version number (e.g. 0.1.1)
# 2) Create a tag like v0.1.1
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, e.g. 0.1.1 (must be higher than the previous version)"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version and update endpoint
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          VERSION="$VERSION" REPO="${{ github.repository }}" node -e '
            const fs = require("fs");
            const p = "src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.version = process.env.VERSION;
            c.plugins.updater.endpoints = ["https://github.com/" + process.env.REPO + "/releases/latest/download/latest.json"];
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
            console.log("version", c.version, "endpoint", c.plugins.updater.endpoints[0]);
          '

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v${{ steps.ver.outputs.version }}
          releaseName: "My Music Player v${{ steps.ver.outputs.version }}"
          releaseBody: "Version ${{ steps.ver.outputs.version }}. Download the setup.exe file to install; installed versions offer the update by themselves."
          releaseDraft: false
          prerelease: false
