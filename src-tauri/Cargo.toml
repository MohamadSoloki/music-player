[package]
name = "music-player"
version = "0.1.0"
description = "موزیک پلیر شخصی"
edition = "2021"

[lib]
name = "music_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
# phone remote: tiny web server, QR code, local addresses, download-by-link
tiny_http = "0.12"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
if-addrs = "0.13"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
# reqwest needs a crypto provider installed before it builds a client (same one the updater uses)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# only one app window: opening the app again focuses the existing one
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# smallest size and lowest resource use
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
