[package]
name = "music-player"
version = "0.1.0"
description = "موزیک پلیر شخصی"
edition = "2021"

[lib]
name = "music_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"

# only one app window: opening the app again focuses the existing one
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# کمترین حجم و مصرف: برای مرحلهٔ بهینه‌سازی
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
