<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>موزیک پلیر من</title>
<style>
:root{
  /* رنگ‌های اصلی؛ از بخش «ظاهر و رنگ‌ها» تغییر می‌کنند */
  --bg:#0e1014; --panel:#161920; --text:#e9ebf1; --accent:#7c5cff; --playbtn:#ffffff;
  --on-accent:#ffffff; --on-play:#111111;
  /* بقیه از روی رنگ‌های بالا ساخته می‌شوند */
  --panel2:color-mix(in srgb, var(--panel) 90%, var(--text));
  --line:color-mix(in srgb, var(--panel) 82%, var(--text));
  --muted:color-mix(in srgb, var(--text) 58%, var(--bg));
  --accent2:color-mix(in srgb, var(--accent) 62%, var(--text));
  --accent-soft:color-mix(in srgb, var(--accent) 18%, transparent);
  --danger:#ff5d6c; --r:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--text);overflow:hidden;font-size:14px;
  font-family:Vazirmatn,"Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select{font:inherit;color:inherit}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;flex:none}
svg.i.fill{fill:currentColor}
.muted{color:var(--muted)} .small{font-size:12px} .pad{padding:8px 10px}
.hidden{display:none!important}

#app{display:grid;grid-template-columns:250px minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;height:100vh}

/* ---- sidebar ---- */
#side{background:var(--panel);border-left:1px solid var(--line);padding:16px 12px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;padding:4px 8px 14px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:var(--on-accent)}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:right;padding:9px 10px;border-radius:10px;color:var(--text)}
.nav-item:hover{background:var(--panel2)}
.nav-item.active{background:var(--accent-soft);color:var(--text)}
.nav-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{font-size:12px;color:var(--muted)}
.nav-head{display:flex;align-items:center;justify-content:space-between;margin:14px 8px 4px;color:var(--muted);font-size:12px}
.nav-head button{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--panel2)}
.nav-head button:hover{background:var(--accent)}
#btnTheme{margin-top:auto}
.side-foot{padding:10px 8px 0;color:var(--muted);font-size:12px;line-height:1.8}

/* ---- main ---- */
#main{display:flex;flex-direction:column;min-height:0;position:relative}
.top{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:18px 20px 12px}
.top h1{margin:0;font-size:22px}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.btn:hover{border-color:var(--accent2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:12px}
.search{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:0 10px;color:var(--muted)}
.search input{background:none;border:0;outline:0;padding:9px 0;width:200px;color:var(--text)}
.search:focus-within{border-color:var(--accent2)}
select.sel{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;outline:0}

.list{flex:1;overflow:auto;padding:0 12px 16px}
.row,.thead{display:grid;grid-template-columns:40px 48px minmax(0,2fr) minmax(0,1.2fr) 60px 112px;gap:12px;align-items:center;padding:6px 10px;border-radius:10px}
.thead{position:sticky;top:0;background:var(--bg);color:var(--muted);font-size:12px;z-index:2;border-bottom:1px solid var(--line);border-radius:0;padding:8px 10px}
.row{cursor:pointer}
.row:hover{background:var(--panel2)}
.row.cur{background:var(--accent-soft)}
.row.cur .t{color:var(--accent2)}
.c-idx{text-align:center;color:var(--muted)}
.c-idx .eq{display:none}
.row:hover .c-idx .num,.row.cur .c-idx .num{display:none}
.row:hover .c-idx .eq,.row.cur .c-idx .eq{display:inline-block;color:var(--accent2)}
.row.cur .c-idx .eq svg{animation:none}
.cover{width:44px;height:44px;border-radius:8px;background-size:cover;background-position:center;display:grid;place-items:center;color:rgba(255,255,255,.75);flex:none}
.cover.big{width:150px;height:150px;border-radius:14px}
.cover.big svg.i{width:48px;height:48px}
.c-main{min-width:0}
.c-main .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-main .t,.c-main .a,.c-album{text-align:right}
.c-main .a,.c-album{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.c-dur{color:var(--muted);font-size:13px;direction:ltr;text-align:center}
.c-act{display:flex;gap:2px;justify-content:flex-end;opacity:.0;transition:opacity .12s}
.row:hover .c-act,.row:focus-within .c-act{opacity:1}
.c-act button{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.c-act button:hover{background:var(--line);color:var(--text)}
.c-act button.d:hover{color:var(--danger)}

.empty{display:grid;place-items:center;text-align:center;color:var(--muted);padding:60px 20px;gap:14px;line-height:1.9}
.empty .big{width:76px;height:76px;border-radius:22px;background:var(--panel2);display:grid;place-items:center;color:var(--accent2)}
.empty .big svg.i{width:34px;height:34px}

.drop-overlay{position:absolute;inset:8px;border:2px dashed var(--accent2);border-radius:16px;background:var(--accent-soft);display:none;place-items:center;font-size:20px;z-index:20;pointer-events:none}
.drop-overlay.on{display:grid}

/* ---- player ---- */
#player{grid-column:1/-1;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:center;padding:10px 18px;position:relative}
.np{display:flex;align-items:center;gap:12px;min-width:0}
.np .meta{min-width:0}
.np #npTitle{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.np #npArtist{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.center{direction:ltr;display:flex;flex-direction:column;gap:6px;align-items:center}
.ctrls{display:flex;gap:10px;align-items:center}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted);position:relative}
.ib:hover{color:var(--text);background:var(--panel2)}
.ib.on{color:var(--accent2)}
.ib .badge{position:absolute;bottom:3px;right:5px;font-size:9px;font-weight:700}
.ib.play{width:46px;height:46px;background:var(--playbtn);color:var(--on-play)}
.ib.play:hover{background:var(--playbtn);color:var(--on-play);transform:scale(1.06)}
.seek{display:flex;gap:10px;align-items:center;width:100%;font-size:12px;color:var(--muted)}
.seek span{width:44px;text-align:center;font-variant-numeric:tabular-nums}
input[type=range]{accent-color:var(--accent);cursor:pointer}
#seek{flex:1;min-width:0}
.right{display:flex;gap:10px;align-items:center;justify-content:flex-end;direction:ltr}
.right input[type=range]{width:100px}
.fxbtn{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);direction:rtl;font-size:13px;white-space:nowrap}
.fxbtn:hover{border-color:var(--accent2)}
.fxbtn.on{border-color:var(--accent);color:var(--accent2)}

#fx{position:absolute;bottom:calc(100% + 8px);left:16px;width:360px;max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 18px 50px rgba(0,0,0,.55);z-index:30;direction:rtl}
#fx h4{margin:0 0 12px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.fxrow{margin-bottom:14px}
.fxrow .lab{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.fxrow .val{font-weight:700;color:var(--accent2);direction:ltr}
.fxrow input[type=range]{width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:12px}
.chip:hover{border-color:var(--accent2)}
.linkrow{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:10px;background:var(--panel2);cursor:pointer;line-height:1.7}
.linkrow input{margin-top:5px}
.hint{color:var(--muted);font-size:12px;line-height:1.8;margin-top:10px}

/* ---- folder / theme ---- */
@keyframes spin{to{transform:rotate(360deg)}}
.spin svg{animation:spin 1s linear infinite}
.btn:disabled{opacity:.6;cursor:default}
.path{display:block;direction:ltr;text-align:left;overflow-wrap:anywhere;color:var(--accent2);font-size:11px;margin-top:2px}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.preset{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:12px}
.preset:hover{border-color:var(--accent2)}
.preset.sel{border-color:var(--accent);background:var(--accent-soft)}
.preset .sw{display:flex}
.preset .sw i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(128,128,128,.5);margin-inline-start:-4px}
.preset .sw i:first-child{margin-inline-start:0}
.trow{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.trow:last-of-type{border-bottom:0}
.trow .tl{flex:1}
.trow .tl small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.trow code{direction:ltr;font-size:12px;color:var(--muted);width:68px;text-align:left}
.trow input[type=color]{width:46px;height:32px;padding:0;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer}

/* ---- app update ---- */
.upd{display:flex;align-items:center;gap:12px;margin:12px 20px 0;padding:10px 14px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--accent)}
.upd .grow{flex:1}
.upd.err{background:rgba(255,93,108,.12);border-color:var(--danger)}
.upd-prog{flex:1;height:8px;border-radius:6px;background:var(--line);overflow:hidden;direction:ltr}
.upd-prog i{display:block;height:100%;width:0;background:var(--accent2);transition:width .2s}
.app-info{padding:10px 8px 0;display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px}

/* ---- modals / toast ---- */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 14px}
.modal .actions{display:flex;gap:8px;justify-content:flex-start;margin-top:18px}
.inp{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:0}
.inp:focus{border-color:var(--accent2)}
.edit-grid{display:flex;gap:18px;flex-wrap:wrap}
.edit-cover{display:flex;flex-direction:column;gap:8px;align-items:center}
.edit-fields{flex:1;min-width:200px;display:flex;flex-direction:column;gap:12px}
.edit-fields label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:12px}
.pick-list{display:flex;flex-direction:column;gap:2px;max-height:260px;overflow:auto;margin:10px 0}
.pick{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer}
.pick:hover{background:var(--panel2)}
.pick span{flex:1}
.pick small{color:var(--muted)}
.newpl{display:flex;gap:8px}
#toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--line);max-width:min(92vw,720px);line-height:1.7;padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:200}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:860px){
  #app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto}
  #side{flex-direction:row;align-items:center;overflow-x:auto;border-left:0;border-bottom:1px solid var(--line);padding:8px}
  #side .brand,#side .nav-head,#side .side-foot{display:none}
  #side nav,#plList{display:flex;gap:4px}
  .nav-item{width:auto;white-space:nowrap}
  .row,.thead{grid-template-columns:32px 44px minmax(0,1fr) 52px 96px}
  .c-album,.thead .c-album{display:none}
  .c-act{opacity:1}
  #player{grid-template-columns:1fr;gap:8px}
  .right{justify-content:space-between}
  #fx{left:8px}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><span class="logo" data-icon="music"></span> موزیک پلیر من</div>
    <nav>
      <button class="nav-item" data-view="all"><span data-icon="music"></span><span class="nm">همه آهنگ‌ها</span><span class="count" id="cAll">0</span></button>
      <div class="nav-head"><span>پلی‌لیست‌ها</span><button id="btnNewPl" title="پلی‌لیست جدید" data-icon="plus"></button></div>
      <div id="plList"></div>
    </nav>
    <button class="nav-item" id="btnTheme"><span data-icon="palette"></span><span class="nm">ظاهر و رنگ‌ها</span></button>
    <div class="side-foot" id="storageInfo"></div>
    <div class="app-info hidden" id="appInfo"><span>نسخه <b id="appVer" dir="ltr">—</b></span><button class="btn sm" id="btnChkUpd">بررسی آپدیت</button></div>
  </aside>

  <main id="main">
    <div id="updBar" class="upd hidden"></div>
    <header class="top">
      <div>
        <h1 id="viewTitle">همه آهنگ‌ها</h1>
        <div id="viewSub" class="muted small"></div>
      </div>
      <div class="top-actions">
        <label class="search"><span data-icon="search"></span><input id="q" type="search" dir="auto" placeholder="جستجوی آهنگ، خواننده، آلبوم…"></label>
        <select id="sortSel" class="sel" title="مرتب‌سازی">
          <option value="new">جدیدترین</option>
          <option value="title">نام آهنگ</option>
          <option value="artist">خواننده</option>
          <option value="album">آلبوم</option>
        </select>
        <span id="plActions" class="top-actions"></span>
        <button class="btn" id="btnPlayAll"><span data-icon="play" class="fillicon"></span> پخش همه</button>
        <button class="btn hidden" id="btnRefresh" title="پوشهٔ آهنگ‌ها را دوباره بررسی کن و آهنگ‌های تازه را اضافه کن"><span data-icon="refresh"></span> رفرش پوشه</button>
        <button class="btn hidden" id="btnOpenDir" title="باز کردن پوشهٔ آهنگ‌ها در Explorer"><span data-icon="folder"></span> باز کردن پوشه</button>
        <button class="btn primary" id="btnAdd"><span data-icon="plus"></span> افزودن آهنگ</button>
        <input type="file" id="fileIn" accept="audio/*,.mp3,.m4a,.flac,.wav,.ogg,.oga,.opus,.aac,.webm" multiple hidden>
      </div>
    </header>
    <section id="list" class="list"></section>
    <div class="drop-overlay" id="drop">فایل‌های موزیک را رها کنید</div>
  </main>

  <footer id="player">
    <div class="np">
      <div id="npCover"></div>
      <div class="meta"><div id="npTitle" dir="auto"></div><div id="npArtist" dir="auto"></div></div>
    </div>
    <div class="center">
      <div class="ctrls">
        <button class="ib" id="btnShuffle" title="پخش تصادفی" data-icon="shuffle"></button>
        <button class="ib" id="btnPrev" title="قبلی" data-icon="prev"></button>
        <button class="ib play" id="btnPlay" title="پخش / توقف"></button>
        <button class="ib" id="btnNext" title="بعدی" data-icon="next"></button>
        <button class="ib" id="btnRepeat" title="تکرار"><span data-icon="repeat"></span><span class="badge" id="repBadge"></span></button>
      </div>
      <div class="seek"><span id="tCur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0"><span id="tDur">0:00</span></div>
    </div>
    <div class="right">
      <button class="fxbtn" id="btnFx"><span data-icon="sliders"></span><span id="fxLabel">سرعت و پیچ</span></button>
      <button class="ib" id="btnMute" title="بی‌صدا"></button>
      <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8">
    </div>

    <div id="fx" class="hidden">
      <h4><span>سرعت و پیچ</span><button class="ib" id="fxClose" data-icon="x" style="width:30px;height:30px"></button></h4>
      <div class="fxrow">
        <div class="lab"><span>سرعت پخش</span><span class="val" id="vSpeed">1.00×</span></div>
        <input type="range" id="fxSpeed" min="0.5" max="2" step="0.05" value="1">
        <div class="chips" style="margin-top:8px">
          <button class="chip" data-speed="0.75">0.75×</button>
          <button class="chip" data-speed="1">1×</button>
          <button class="chip" data-speed="1.25">1.25×</button>
          <button class="chip" data-speed="1.5">1.5×</button>
        </div>
      </div>
      <div class="fxrow">
        <div class="lab"><span>پیچ (Pitch)</span><span class="val" id="vPitch">0</span></div>
        <input type="range" id="fxPitch" min="-12" max="12" step="0.5" value="0">
        <div class="chips" style="margin-top:8px">
          <button class="chip" data-pitch="-2">−2</button>
          <button class="chip" data-pitch="-1">−1</button>
          <button class="chip" data-pitch="0">0</button>
          <button class="chip" data-pitch="1">+1</button>
          <button class="chip" data-pitch="2">+2</button>
        </div>
      </div>
      <label class="linkrow">
        <input type="checkbox" id="fxLink">
        <span><b>پیچ همراه سرعت تغییر کند</b><br><span class="muted small">مثل صفحهٔ گرامافون: سرعت بالا = صدای نازک‌تر (نایت‌کور)، سرعت پایین = صدای بم‌تر (اسلوود).</span></span>
      </label>
      <div class="chips" style="margin-top:12px">
        <button class="chip" data-preset="original">اصلی</button>
        <button class="chip" data-preset="slowed">Slowed</button>
        <button class="chip" data-preset="nightcore">Nightcore</button>
      </div>
      <div class="hint" id="fxNote"></div>
    </div>
  </footer>
</div>
<div id="toast"></div>

<script>
'use strict';

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
/* داخل برنامهٔ ویندوز (Tauri) آهنگ‌ها در پوشه ذخیره می‌شوند؛ در مرورگر داخل IndexedDB */
const TAURI = window.__TAURI__;
const IS_APP = !!(TAURI && TAURI.updater);
const FS = (TAURI && TAURI.fs && TAURI.path && TAURI.core) ? TAURI.fs : null;
const AUDIO_RE = /\.(mp3|m4a|flac|wav|ogg|oga|opus|aac|webm|wma)$/i;
let FOLDER = false, MUSIC_DIR = '', SEP = '\\';
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fullPath = rel => MUSIC_DIR + SEP + rel.split('/').join(SEP);
const fileUrl = rel => TAURI.core.convertFileSrc(fullPath(rel));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const ICONS = {
  play:'<polygon points="6 4 20 12 6 20 6 4"/>',
  pause:'<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>',

let db;
function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('myMusicPlayer', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('tracks', {keyPath:'id', autoIncrement:true});
      d.createObjectStore('playlists', {keyPath:'id', autoIncrement:true});
      d.createObjectStore('audio');
      d.createObjectStore('covers');
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
const dbGetAll = store => new Promise((res, rej) => { const r = db.transaction(store).objectStore(store).getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const dbGet = (store, key) => new Promise((res, rej) => { const r = db.transaction(store).objectStore(store).get(key); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
function dbPut(store, val, key){
  return new Promise((res, rej) => {
    const t = db.transaction(store, 'readwrite');
    const os = t.objectStore(store);
    const r = key === undefined ? os.put(val) : os.put(val, key);
    let id; r.onsuccess = () => { id = r.result; };
    t.oncomplete = () => res(id);
    t.onerror = t.onabort = () => rej(t.error || new Error('abort'));
  });
}
function dbDel(stores, key){
  stores = [].concat(stores);
  return new Promise((res, rej) => {
    const t = db.transaction(stores, 'readwrite');
    stores.forEach(s => t.objectStore(s).delete(key));
    t.oncomplete = () => res();
    t.onerror = t.onabort = () => rej(t.error || new Error('abort'));
  });
}
function dbAddTrack(meta, audioBlob, coverBlob){
  return new Promise((res, rej) => {
    const t = db.transaction(['tracks','audio','covers'], 'readwrite');
    const r = t.objectStore('tracks').add(meta);
    let id;
    r.onsuccess = () => {
      id = r.result;
      if(audioBlob) t.objectStore('audio').put(audioBlob, id);
      if(coverBlob) t.objectStore('covers').put(coverBlob, id);
    };
    t.oncomplete = () => res(id);
    t.onerror = t.onabort = () => rej(t.error || new Error('abort'));
  });
}

/* ================= ID3 tags ================= */
function decodeText(body){
  if(!body.length) return '';
  const enc = body[0], d = body.subarray(1);
  let s;
  try{
    if(enc === 1){
      let le = true, st = 0;
      if(d[0] === 0xFF && d[1] === 0xFE){ le = true; st = 2; }
      else if(d[0] === 0xFE && d[1] === 0xFF){ le = false; st = 2; }
      s = new TextDecoder(le ? 'utf-16le' : 'utf-16be').decode(d.subarray(st));
    }
    else if(enc === 2) s = new TextDecoder('utf-16be').decode(d);
    else if(enc === 3) s = new TextDecoder('utf-8').decode(d);
    else s = new TextDecoder('iso-8859-1').decode(d);
  }catch(e){ return ''; }
  return s.replace(/\uFEFF/g, '').replace(/\u0000+$/, '').replace(/\u0000/g, ' / ').trim();
}
function parseApic(b){
  const enc = b[0]; let p = 1;
  const mimeEnd = b.indexOf(0, p); if(mimeEnd < 0) return null;
  p = mimeEnd + 1; p++; // picture type
  if(enc === 1 || enc === 2){ while(p + 1 < b.length && !(b[p] === 0 && b[p+1] === 0)) p += 2; p += 2; }
  else { while(p < b.length && b[p] !== 0) p++; p++; }
  const data = b.subarray(p);
  if(data.length < 100) return null;
  return new Blob([data], {type: data[0] === 0x89 ? 'image/png' : 'image/jpeg'});
}
// src: یک File، یا {rangeReader(start, len)} برای خواندن بخشی از فایل روی دیسک
async function readTags(src){
  const out = {};
  const rd = src.rangeReader || (async (s, l) => new Uint8Array(await src.slice(s, s + l).arrayBuffer()));
  try{
    const head = await rd(0, 10);
    if(head[0] !== 0x49 || head[1] !== 0x44 || head[2] !== 0x33) return out;
    const ver = head[3];
    if(ver < 3) return out;
    const size = ((head[6] & 0x7f) << 21) | ((head[7] & 0x7f) << 14) | ((head[8] & 0x7f) << 7) | (head[9] & 0x7f);
    const buf = await rd(10, Math.min(size, 16 * 1024 * 1024));
    let p = 0;
    if(head[5] & 0x40){
      p = ver === 4
        ? ((buf[0] & 0x7f) << 21) | ((buf[1] & 0x7f) << 14) | ((buf[2] & 0x7f) << 7) | (buf[3] & 0x7f)
        : (((buf[0] << 24) | (buf[1] << 16) | (buf[2] << 8) | buf[3]) >>> 0) + 4;
    }
    while(p + 10 <= buf.length){
      const id = String.fromCharCode(buf[p], buf[p+1], buf[p+2], buf[p+3]);
      if(!/^[A-Z0-9]{4}$/.test(id)) break;
      const fs = ver === 4
        ? ((buf[p+4] & 0x7f) << 21) | ((buf[p+5] & 0x7f) << 14) | ((buf[p+6] & 0x7f) << 7) | (buf[p+7] & 0x7f)
        : (((buf[p+4] << 24) | (buf[p+5] << 16) | (buf[p+6] << 8) | buf[p+7]) >>> 0);
      const body = buf.subarray(p + 10, p + 10 + fs);
      p += 10 + fs;
      if(!fs) continue;
      if(id === 'TIT2') out.title = decodeText(body);
      else if(id === 'TPE1') out.artist = decodeText(body);
      else if(id === 'TALB') out.album = decodeText(body);
      else if(id === 'APIC' && !out.cover) out.cover = parseApic(body);
    }
  }catch(e){}
  return out;
}
function parseName(name){
  let base = name.replace(/\.[^.]+$/, '').replace(/_/g, ' ').trim();
  // شمارهٔ ترک اول نام ("09. " یا "09 - ") جزو نام خواننده/آهنگ نیست
  const noNum = base.replace(/^\d{1,3}\s*[.)\-]\s*/, '').trim();
  if(noNum) base = noNum;
  const m = base.match(/^(.+?)\s+-\s+(.+)$/);
  return m ? {artist: m[1].trim(), title: m[2].trim()} : {artist: '', title: base};
}
// src: File یا آدرس (رشته)
function getDuration(src){
  return new Promise(res => {
    const a = new Audio(); a.preload = 'metadata';
    const isUrl = typeof src === 'string';
    const u = isUrl ? src : URL.createObjectURL(src);
    let fin = false;
    const done = d => {
      if(fin) return; fin = true;
      a.removeAttribute('src'); try{ a.load(); }catch(e){}
      if(!isUrl) URL.revokeObjectURL(u);
      res(isFinite(d) ? d : 0);
    };
    a.onloadedmetadata = () => done(a.duration);
    a.onerror = () => done(0);
    setTimeout(() => done(0), 8000);
    a.src = u;
  });
}
async function resizeCover(blob, max){
  max = max || 500;
  const url = URL.createObjectURL(blob);
  try{
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('cover')), 'image/jpeg', 0.88));
  } finally { URL.revokeObjectURL(url); }
}

/* ================= pitch shifter (delay-line granular, crossfaded) ================= */
class Jungle{
  constructor(ctx){
    const BT = 0.1, FT = 0.05;
    this.ctx = ctx; this.BT = BT;
    const sr = ctx.sampleRate, len = Math.round(BT * sr), fl = Math.round(FT * sr);
    const mk = fn => { const b = ctx.createBuffer(1, len, sr), d = b.getChannelData(0); for(let i = 0; i < len; i++) d[i] = fn(i); return b; };
    const down = mk(i => i / len);
    const up = mk(i => (len - i) / len);
    const fade = mk(i => i < fl ? Math.sqrt(i / fl) : (i >= len - fl ? Math.sqrt(1 - (i - (len - fl)) / fl) : 1));
    const src = buf => { const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; return s; };
    this.input = ctx.createGain(); this.output = ctx.createGain();
    this.amt = [ctx.createGain(), ctx.createGain()];
    this.downSw = [ctx.createGain(), ctx.createGain()];
    this.upSw = [ctx.createGain(), ctx.createGain()];
    const t0 = ctx.currentTime + 0.05, off = BT - FT;
    for(let k = 0; k < 2; k++){
      const delay = ctx.createDelay(1);
      const st = t0 + k * off;
      const sd = src(down), su = src(up), sf = src(fade);
      this.upSw[k].gain.value = 0;
      sd.connect(this.downSw[k]); su.connect(this.upSw[k]);
      this.downSw[k].connect(this.amt[k]); this.upSw[k].connect(this.amt[k]);
      this.amt[k].gain.value = 0;
      this.amt[k].connect(delay.delayTime);
      const mix = ctx.createGain(); mix.gain.value = 0;
      sf.connect(mix.gain);
      this.input.connect(delay); delay.connect(mix); mix.connect(this.output);
      sd.start(st); su.start(st); sf.start(st);
    }
  }
  setRatio(r){
    const up = r > 1, D = Math.abs(r - 1) * this.BT, now = this.ctx.currentTime;
    for(let k = 0; k < 2; k++){
      this.downSw[k].gain.value = up ? 0 : 1;
      this.upSw[k].gain.value = up ? 1 : 0;
      this.amt[k].gain.setTargetAtTime(D, now, 0.02);
    }
  }
}

/* ================= audio engine ================= */
const audio = new Audio();
audio.preload = 'auto';
let ctx = null, dryG, wetG, jungle, curUrl = null;

function ensureGraph(){
  if(ctx){ if(ctx.state === 'suspended') ctx.resume(); return; }
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    const c = new AC();
    const srcNode = c.createMediaElementSource(audio);
    dryG = c.createGain(); wetG = c.createGain();
    jungle = new Jungle(c);
    srcNode.connect(dryG); dryG.connect(c.destination);
    srcNode.connect(jungle.input); jungle.output.connect(wetG); wetG.connect(c.destination);
    ctx = c;
    if(c.state === 'suspended') c.resume();
  }catch(e){ console.error(e); ctx = null; }
}
function applyFx(){
  const keep = !S.fx.link;
  audio.preservesPitch = keep; audio.mozPreservesPitch = keep; audio.webkitPreservesPitch = keep;
  audio.defaultPlaybackRate = S.fx.speed;
  audio.playbackRate = S.fx.speed;
  if(!ctx) return;
  if(Math.abs(S.fx.pitch) < 0.01){ dryG.gain.value = 1; wetG.gain.value = 0; jungle.setRatio(1); }
  else { dryG.gain.value = 0; wetG.gain.value = 1; jungle.setRatio(Math.pow(2, S.fx.pitch / 12)); }
}

const col = new Intl.Collator('fa', {numeric:true, sensitivity:'base'});
const getPl = id => S.playlists.find(p => p.id === id);

function viewIds(){
  let ids;
  if(S.view === 'all') ids = [...S.tracks.keys()];
  else { const p = getPl(S.view); ids = p ? p.trackIds.filter(id => S.tracks.has(id)) : []; }
  const q = S.q.trim().toLowerCase();
  if(q) ids = ids.filter(id => { const t = S.tracks.get(id); return (t.title + ' ' + t.artist + ' ' + t.album).toLowerCase().includes(q); });
  if(S.view === 'all'){
    const g = id => S.tracks.get(id);
    if(S.sort === 'title') ids.sort((a, b) => col.compare(g(a).title, g(b).title));
    else if(S.sort === 'artist') ids.sort((a, b) => col.compare(g(a).artist, g(b).artist));
    else if(S.sort === 'album') ids.sort((a, b) => col.compare(g(a).album, g(b).album));
    else ids.sort((a, b) => b - a);
  }
  return ids;
}

  document.title = t && S.playing ? t.title + ' — موزیک پلیر' : 'موزیک پلیر من';
  if(t) setMediaSession(t);
  markCurrent();
}
function syncPlayBtn(){
  $('#btnPlay').innerHTML = icon(S.playing ? 'pause' : 'play', 'fill');
  const t = S.tracks.get(S.curId);
  document.title = t && S.playing ? t.title + ' — موزیک پلیر' : 'موزیک پلیر من';
}
function setMediaSession(t){
  if(!('mediaSession' in navigator)) return;
  try{
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t.title, artist: t.artist, album: t.album,
      artwork: S.covers.has(t.id) ? [{src: S.covers.get(t.id), sizes: '500x500', type: 'image/jpeg'}] : []
    });
  }catch(e){}
}
async function playIndex(i){
  if(i < 0 || i >= S.queue.length){ stopPlayback(); return; }
  const id = S.queue[i], t = S.tracks.get(id);
  if(!t) return;
  S.qi = i; S.curId = id;
  ensureGraph();
  updateNowPlaying();
  if(FOLDER){
    if(!t.file){ toast('مسیر فایل این آهنگ مشخص نیست؛ دکمهٔ رفرش را بزن'); return; }
    const ok = await loadUrl(fileUrl(t.file));
    if(S.curId !== id) return;
    if(!ok){
      S.playing = false; syncPlayBtn();
      let why = 'فرمت پشتیبانی نمی‌شود یا فایل خراب است';
      try{ if(!await FS.exists(fullPath(t.file))) why = 'فایل در پوشه پیدا نشد (حذف یا جابه‌جا شده)؛ دکمهٔ رفرش را بزن'; }catch(e){}
      console.warn('load failed: ' + JSON.stringify({file: t.file, error: lastLoadErr}));
      toast('پخش نشد: ' + why + (lastLoadErr ? ' | خطا: ' + lastLoadErr : ''), false, 9000);
      return;
    }
    applyFx();
    try{ await audio.play(); }catch(e){ console.warn(e); }
    return;
  }
  const blob = await dbGet('audio', id);
  if(S.curId !== id) return;
  if(!blob){ toast('فایل این آهنگ پیدا نشد'); return; }
  let ok = await loadSource(blob, preferData, id);
  if(S.curId !== id) return;
  if(!ok && !preferData && /safety|not allowed/i.test(lastLoadErr)){
    // مرورگر یا پنجرهٔ میزبان blob: را رد کرده؛ با data: امتحان کن
    ok = await loadSource(blob, true, id);
    if(S.curId !== id) return;
    if(ok) preferData = true;
  }
  let head = null, kind = '';
  if(!ok){
    // type خالی یا اشتباه: فرمت را از روی محتوا تشخیص بده و یک بار دیگر امتحان کن
    head = new Uint8Array(await blob.slice(0, 16).arrayBuffer());
    kind = sniffMime(head);
    if(S.curId !== id) return;
    if(kind && kind !== 'unsupported' && kind !== blob.type){
      ok = await loadSource(blob.slice(0, blob.size, kind), preferData, id);
      if(S.curId !== id) return;
    }
  }
  if(!ok){
    const d = describeFile(head, blob.size, kind, t.size);
    if(/safety|not allowed/i.test(lastLoadErr)) d.verdict = 'این پنجره پخش فایل را مسدود کرده؛ فایل HTML را روی کامپیوتر ذخیره کن و مستقیم در Chrome یا Edge باز کن (نه داخل پیش‌نمایش)';
    console.warn('load failed: ' + JSON.stringify({file: t.fileName, size: blob.size, storedSize: t.size, blobType: blob.type, head: d.hex, verdict: d.verdict, error: lastLoadErr}));
    S.playing = false; syncPlayBtn();
    toast('پخش نشد: ' + d.verdict + ' | حجم: ' + blob.size + ' بایت | شروع فایل: ' + d.hex + (lastLoadErr ? ' | خطا: ' + lastLoadErr : ''), false, 15000);
    return;
  }
  applyFx();
  try{ await audio.play(); }catch(e){ console.warn(e); }
}
let loadingSrc = false, lastLoadErr = '';
function describeFile(u, size, kind, storedSize){
  u = u || new Uint8Array(0);
  const hex = Array.from(u.subarray(0, 8)).map(b => b.toString(16).padStart(2, '0')).join(' ') || '—';
  let verdict;
  if(!size) verdict = 'فایل ذخیره‌شده خالی است';
  else if(storedSize && storedSize !== size) verdict = 'فایل ذخیره‌شده با فایل اصلی هم‌اندازه نیست (ذخیرهٔ ناقص)';
  else if(kind === 'unsupported') verdict = 'فرمت WMA است';
  else if(u[0] === 0x3C) verdict = 'محتوا شبیه صفحهٔ وب (HTML) است، نه آهنگ';
  else if(u[0] === 0x50 && u[1] === 0x4B) verdict = 'فایل ZIP است، نه آهنگ';
  else if(kind) verdict = 'ساختار ' + kind.replace('audio/', '').toUpperCase() + ' دارد ولی مرورگر لودش نکرد';
  else verdict = 'محتوای فایل، صوتیِ شناخته‌شده نیست';
  return {hex, verdict};
}
let preferData = false;
function blobToDataUrl(b){
  return new Promise((res, rej) => { const f = new FileReader(); f.onload = () => res(f.result); f.onerror = () => rej(f.error); f.readAsDataURL(b); });
}
async function loadSource(blob, asData, id){
  if(curUrl){ URL.revokeObjectURL(curUrl); curUrl = null; }
  lastLoadErr = '';
  let url;
  if(asData){
    try{ url = await blobToDataUrl(blob); }catch(e){ lastLoadErr = 'data url: ' + (e && e.message); return false; }
    if(id != null && S.curId !== id) return false;
  } else { url = curUrl = URL.createObjectURL(blob); }
  return waitLoad(url);
}
// آهنگ از پوشه: مستقیم از دیسک و به‌صورت جریانی پخش می‌شود (بدون بارگذاری کل فایل در رم)
function loadUrl(url){
  if(curUrl){ URL.revokeObjectURL(curUrl); curUrl = null; }
  lastLoadErr = '';
  return waitLoad(url);
}
function waitLoad(url){
  return new Promise(res => {
    loadingSrc = true;
    const done = v => { audio.removeEventListener('loadedmetadata', onOk); audio.removeEventListener('error', onBad); loadingSrc = false; res(v); };
    const onOk = () => done(true);
    const onBad = () => { lastLoadErr = audio.error ? audio.error.code + ' ' + (audio.error.message || '') : ''; done(false); };
    audio.addEventListener('loadedmetadata', onOk);
    audio.addEventListener('error', onBad);
    audio.src = url;
  });
}
function sniffMime(u){
  const s = (a, b) => String.fromCharCode.apply(null, u.subarray(a, b));
  if(u[0] === 0x30 && u[1] === 0x26 && u[2] === 0xB2 && u[3] === 0x75) return 'unsupported'; // WMA/ASF
  if(s(0, 3) === 'ID3') return 'audio/mpeg';
  if(u[0] === 0xFF && (u[1] & 0xE0) === 0xE0) return (u[1] & 0xF6) === 0xF0 ? 'audio/aac' : 'audio/mpeg';
  if(s(0, 4) === 'fLaC') return 'audio/flac';
  if(s(0, 4) === 'OggS') return 'audio/ogg';
  if(s(0, 4) === 'RIFF' && s(8, 12) === 'WAVE') return 'audio/wav';
  if(s(4, 8) === 'ftyp') return 'audio/mp4';
  if(u[0] === 0x1A && u[1] === 0x45 && u[2] === 0xDF && u[3] === 0xA3) return 'audio/webm';
  return '';
}
function playList(ids, startId){
  if(!ids.length) return;
  S.queue = ids.slice(); S.hist = [];
  let i = startId != null ? ids.indexOf(startId) : (S.shuffle ? Math.floor(Math.random() * ids.length) : 0);
  if(i < 0) i = 0;
  playIndex(i);
}
function stopPlayback(){
  audio.pause(); try{ audio.currentTime = 0; }catch(e){}
  S.playing = false; syncPlayBtn();
}
function next(auto){
  if(!S.queue.length) return;
  if(auto && S.repeat === 2){ audio.currentTime = 0; audio.play(); return; }
  let ni;
  if(S.shuffle && S.queue.length > 1){ do{ ni = Math.floor(Math.random() * S.queue.length); }while(ni === S.qi); }
  else {
    ni = S.qi + 1;
    if(ni >= S.queue.length){
      if(S.repeat === 1 || !auto) ni = 0;
      else { stopPlayback(); return; }
    }
  }
  S.hist.push(S.qi); playIndex(ni);
}
function prev(){
  if(!S.queue.length) return;
  if(audio.currentTime > 3){ audio.currentTime = 0; return; }
  if(S.hist.length){ playIndex(S.hist.pop()); return; }
  playIndex(S.qi > 0 ? S.qi - 1 : S.queue.length - 1);
}
function togglePlay(){
  if(S.curId == null){
    const ids = viewIds();
    if(ids.length) playList(ids);
    return;
  }
  if(audio.paused){ ensureGraph(); audio.play().catch(() => {}); } else audio.pause();
}

function openModal(html, onMount, onClose){
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = '<div class="modal">' + html + '</div>';
  document.body.appendChild(back);
  const modal = back.firstChild;
  let closed = false;
  const onKey = e => { if(e.key === 'Escape') close(); };
  const close = () => { if(closed) return; closed = true; back.remove(); document.removeEventListener('keydown', onKey); if(onClose) onClose(); };
  document.addEventListener('keydown', onKey);
  back.addEventListener('mousedown', e => { if(e.target === back) close(); });
  modal.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
  if(onMount) onMount(modal, close);
  return close;
}

/* ================= adding / deleting tracks ================= */
async function addFiles(files){
  const list = [...files].filter(f => (f.type || '').startsWith('audio/') || /\.(mp3|m4a|flac|wav|ogg|oga|opus|aac|webm|wma)$/i.test(f.name));
  if(!list.length){ toast('فایل صوتی پیدا نشد'); return; }
  if(FOLDER) return addFilesToFolder(list);
  let ok = 0, fail = 0;
  for(let i = 0; i < list.length; i++){
    const f = list[i];
    toast('در حال افزودن ' + (i + 1) + ' از ' + list.length + '…', true);
    try{
      if(!f.size) throw new Error('empty file');
      const tag = await readTags(f);
      const nm = parseName(f.name);
      const dur = await getDuration(f);
      let cover = null;
      if(tag.cover){ try{ cover = await resizeCover(tag.cover); }catch(e){ cover = null; } }
      const meta = {
        title: tag.title || nm.title || 'بدون نام',
        artist: tag.artist || nm.artist || '',
        album: tag.album || '',
        duration: dur, added: Date.now(), fileName: f.name, size: f.size, hasCover: !!cover
      };
      meta.id = await dbAddTrack(meta, f, cover);
      S.tracks.set(meta.id, meta);
      if(cover) S.covers.set(meta.id, URL.createObjectURL(cover));
      ok++;
    }catch(e){
      console.error(e); fail++;
      if(e && e.name === 'QuotaExceededError'){ toast('فضای ذخیره‌سازی مرورگر پر شده است'); break; }
    }
  }
  renderAll(); updateStorage();
  toast(ok + ' آهنگ اضافه شد' + (fail ? ' · ' + fail + ' مورد ناموفق' : ''));
}
async function removeTrackRecord(id){
  await dbDel(['tracks','audio','covers'], id);
  for(const p of S.playlists){
    if(p.trackIds.includes(id)){ p.trackIds = p.trackIds.filter(x => x !== id); await dbPut('playlists', p); }
  }
  if(S.covers.has(id)){ URL.revokeObjectURL(S.covers.get(id)); S.covers.delete(id); }
  S.tracks.delete(id);
  S.queue = S.queue.filter(x => x !== id);
  if(S.curId === id){ stopPlayback(); S.curId = null; S.qi = -1; audio.removeAttribute('src'); try{ audio.load(); }catch(e){} updateNowPlaying(); }
  else S.qi = S.queue.indexOf(S.curId);
}
async function deleteTrack(id){
  const t = S.tracks.get(id); if(!t) return;
  const msg = FOLDER
    ? '«' + t.title + '» حذف شود؟ فایل آهنگ از پوشهٔ برنامه هم پاک می‌شود.'
    : '«' + t.title + '» از کتابخانه و همهٔ پلی‌لیست‌ها حذف شود؟';
  if(!await askConfirm(msg, 'حذف')) return;

      if(S.curId === id){ stopPlayback(); audio.removeAttribute('src'); try{ audio.load(); }catch(e){} await sleep(200); }

      catch(e){ console.error(e); toast('فایل از پوشه پاک نشد (شاید در برنامهٔ دیگری باز است)', false, 6000); return; }

/* ---------- حالت پوشه (برنامهٔ ویندوز) ---------- */
async function diskReader(path){
  const h = await FS.open(path, {read: true});
  return {
    rangeReader: async (start, len) => {
      await h.seek(start, FS.SeekMode.Start);
      const buf = new Uint8Array(len);
      let got = 0;
      while(got < len){
        const n = await h.read(got ? buf.subarray(got) : buf);
        if(!n) break;
        got += n;
      }
      return buf.subarray(0, got);
    },
    close: () => h.close()
  };
}
async function listDisk(dir, rel, depth, out){
  const entries = await FS.readDir(dir);
  for(const e of entries){
    const r = rel ? rel + '/' + e.name : e.name;
    if(e.isDirectory){ if(depth < 3) await listDisk(dir + SEP + e.name, r, depth + 1, out); }
    else if(e.isFile && AUDIO_RE.test(e.name)) out.push(r);
  }
}
// فایلی را که در پوشه هست وارد کتابخانه می‌کند. fileObj فقط وقتی هست که همین الان از بیرون کپی شده.
async function importDiskFile(rel, fileObj){
  const path = fullPath(rel);
  const name = rel.split('/').pop();
  let size;
  if(fileObj) size = fileObj.size;
  else {
    const s1 = await FS.stat(path);
    if(!s1.size) return false;
    // فایلی که چند ثانیه پیش نوشته شده شاید هنوز در حال کپی باشد
    if(s1.mtime && Date.now() - s1.mtime.getTime() < 5000){
      await sleep(600);
      const s2 = await FS.stat(path);
      if(s2.size !== s1.size) return false;
    }
    size = s1.size;
  }
  let tag = {};
  if(fileObj) tag = await readTags(fileObj);
  else {
    const r = await diskReader(path);
    try{ tag = await readTags(r); } finally{ try{ await r.close(); }catch(e){} }
  }
  const nm = parseName(name);
  const dur = await getDuration(fileObj || fileUrl(rel));
  let cover = null;
  if(tag.cover){ try{ cover = await resizeCover(tag.cover); }catch(e){ cover = null; } }
  const meta = {
    title: tag.title || nm.title || 'بدون نام', artist: tag.artist || nm.artist || '', album: tag.album || '',
    duration: dur, added: Date.now(), fileName: name, file: rel, size, hasCover: !!cover
  };
  meta.id = await dbAddTrack(meta, null, cover);
  S.tracks.set(meta.id, meta);
  if(cover) S.covers.set(meta.id, URL.createObjectURL(cover));
  return true;
}
let scanning = false;
function setRefreshBusy(b){ const el = $('#btnRefresh'); el.disabled = b; el.classList.toggle('spin', b); }
// پوشه را می‌خواند: آهنگ‌های تازه را اضافه و آهنگ‌هایی را که فایلشان دیگر نیست حذف می‌کند
async function scanFolder(manual){
  if(!FOLDER || scanning) return;
  scanning = true; setRefreshBusy(true);
  let added = 0, removed = 0, pending = 0;
  try{
    const files = [];
    await listDisk(MUSIC_DIR, '', 0, files);
    const onDisk = new Set(files);
    const withFile = [...S.tracks.values()].filter(t => t.file);
    let doRemove = true;
    if(!files.length && withFile.length){
      // پوشهٔ خالی: شاید پوشه پاک یا عوض شده؛ بی‌اجازه کتابخانه را خالی نکن
      doRemove = manual && await askConfirm('پوشهٔ آهنگ‌ها خالی است. همهٔ آهنگ‌های کتابخانه (و جای آن‌ها در پلی‌لیست‌ها) حذف شوند؟', 'حذف');
    }
    const known = new Set();
    for(const t of withFile){
      if(onDisk.has(t.file)) known.add(t.file);
      else if(doRemove){ await removeTrackRecord(t.id); removed++; }
    }
    const fresh = files.filter(r => !known.has(r));
    for(let i = 0; i < fresh.length; i++){
      if(manual || fresh.length > 3) toast('در حال افزودن ' + (i + 1) + ' از ' + fresh.length + '…', true);
      try{ if(await importDiskFile(fresh[i])) added++; else pending++; }
      catch(e){ console.warn('import failed', fresh[i], e); pending++; }
    }
  }catch(e){
    console.error(e);
    toast('خواندن پوشهٔ آهنگ‌ها ممکن نشد: ' + ((e && e.message) || e), false, 7000);
    return;
  }finally{
    scanning = false; setRefreshBusy(false);
  }
  renderAll(); updateStorage();
  const parts = [];
  if(added) parts.push(added + ' آهنگ جدید اضافه شد');
  if(removed) parts.push(removed + ' آهنگ که فایلش دیگر در پوشه نبود حذف شد');
  if(pending) parts.push(pending + ' فایل هنوز آماده نیست؛ چند لحظه بعد دوباره رفرش کن');
  if(parts.length) toast(parts.join(' · '), false, 5000);
  else if(manual) toast('آهنگ جدیدی در پوشه پیدا نشد');
  else $('#toast').classList.remove('show');
}
async function uniqueName(name){
  name = name.replace(/[\\/:*?"<>|]/g, '_');
  const m = name.match(/^(.*?)(\.[^.]*)?$/);
  const base = m[1], ext = m[2] || '';
  const used = rel => [...S.tracks.values()].some(t => t.file === rel);
  let n = name, i = 2;
  while(used(n) || await FS.exists(fullPath(n))) n = base + ' (' + (i++) + ')' + ext;
  return n;
}
async function addFilesToFolder(list){
  let ok = 0, fail = 0;
  for(let i = 0; i < list.length; i++){
    const f = list[i];
    toast('در حال افزودن ' + (i + 1) + ' از ' + list.length + '…', true);
    let rel = null;
    try{
      if(!f.size) throw new Error('empty file');
      rel = await uniqueName(f.name);
      await FS.writeFile(fullPath(rel), f.stream());
      await importDiskFile(rel, f);
      ok++;
    }catch(e){
      console.error(e); fail++;
      if(rel && ![...S.tracks.values()].some(t => t.file === rel)){ try{ await FS.remove(fullPath(rel)); }catch(_){} }
    }
  }
  renderAll(); updateStorage();
  toast(ok + ' آهنگ به پوشه اضافه شد' + (fail ? ' · ' + fail + ' مورد ناموفق' : ''));
}

}

document.addEventListener('keydown', e => {
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  const el = e.target, tag = el.tagName;
  const typing = tag === 'TEXTAREA' || tag === 'SELECT' || (tag === 'INPUT' && !['range', 'button'].includes(el.type));

/* ================= app updater (فقط داخل برنامهٔ ویندوز) ================= */
let pendingUpdate = null, updBusy = false;
function showUpd(html, cls){ const b = $('#updBar'); b.className = 'upd ' + (cls || ''); b.innerHTML = html; }
function hideUpd(){ $('#updBar').className = 'upd hidden'; }
async function checkUpdate(manual){
  if(!IS_APP || updBusy) return;
  const btn = $('#btnChkUpd');
  if(manual){ btn.disabled = true; btn.textContent = 'در حال بررسی…'; }
  try{
    const u = await TAURI.updater.check();
    if(u){
      pendingUpdate = u;
      showUpd('<span>نسخهٔ جدید <b dir="ltr">' + esc(u.version) + '</b> آماده است.</span><span class="grow"></span><button class="btn primary sm" id="btnDoUpd">آپدیت</button><button class="btn sm" id="btnLaterUpd">بعداً</button>');
      $('#btnDoUpd').onclick = doUpdate;
      $('#btnLaterUpd').onclick = hideUpd;
    } else if(manual){ toast('برنامه آخرین نسخه را دارد'); }
  }catch(e){
    console.warn('update check failed', e);
    if(manual) toast('بررسی آپدیت نشد: ' + ((e && e.message) || e), false, 6000);
  }finally{
    if(manual){ btn.disabled = false; btn.textContent = 'بررسی آپدیت'; }
  }
}
async function doUpdate(){
  if(!pendingUpdate || updBusy) return;
  updBusy = true;
  let total = 0, got = 0;
  showUpd('<span>در حال دانلود آپدیت…</span><div class="upd-prog"><i id="updFill"></i></div><span id="updPct" dir="ltr">0%</span>');
  try{
    await pendingUpdate.downloadAndInstall(ev => {
      if(ev.event === 'Started') total = ev.data.contentLength || 0;
      else if(ev.event === 'Progress'){
        got += ev.data.chunkLength;
        if(total){
          const p = Math.min(100, Math.round(got / total * 100));
          const f = $('#updFill'), t = $('#updPct');
          if(f) f.style.width = p + '%';
          if(t) t.textContent = p + '%';
        }
      }
      else if(ev.event === 'Finished') showUpd('<span>در حال نصب… برنامه خودش دوباره باز می‌شود.</span>');
    });
    try{ await TAURI.process.relaunch(); }catch(e){ console.warn(e); }
  }catch(e){
    console.warn('update failed', e);
    updBusy = false;
    showUpd('<span>آپدیت انجام نشد: ' + esc((e && e.message) || e) + '</span><span class="grow"></span><button class="btn sm" id="btnRetryUpd">تلاش دوباره</button>', 'err');
    $('#btnRetryUpd').onclick = doUpdate;
  }
}

  if(!IS_APP) return;
  $('#appInfo').classList.remove('hidden');
  try{ $('#appVer').textContent = await TAURI.app.getVersion(); }catch(e){}
  $('#btnChkUpd').onclick = () => checkUpdate(true);
  setTimeout(() => checkUpdate(false), 4000);
  setInterval(() => checkUpdate(false), 6 * 3600 * 1000);
}

function loadTheme(){
  const saved = store.get('mp_theme', {}), t = Object.assign({}, THEMES[0].v);

function lum(h){
  const c = [1, 3, 5].map(i => { const v = parseInt(h.slice(i, i + 2), 16) / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}
const onColor = h => lum(h) > 0.179 ? '#111111' : '#ffffff';
function applyTheme(){
  const st = document.documentElement.style;
  st.setProperty('--accent', theme.accent); st.setProperty('--bg', theme.bg); st.setProperty('--panel', theme.panel);

  st.setProperty('--on-accent', onColor(theme.accent)); st.setProperty('--on-play', onColor(theme.play));
  st.colorScheme = lum(theme.bg) > 0.4 ? 'light' : 'dark';
}

    return;
  }
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  try{
    const [tracks, pls] = await Promise.all([dbGetAll('tracks'), dbGetAll('playlists')]);
    tracks.forEach(t => S.tracks.set(t.id, t));
    S.playlists = pls;
    await Promise.all(tracks.filter(t => t.hasCover).map(async t => {
      const b = await dbGet('covers', t.id);
      if(b) S.covers.set(t.id, URL.createObjectURL(b));
    }));
  }catch(e){ console.error(e); toast('خواندن کتابخانه با مشکل روبه‌رو شد'); }
  updateNowPlaying();
  renderAll(); updateStorage();
  if(FOLDER) scanFolder(false);   // آهنگ‌هایی که دستی در پوشه گذاشته‌ای
})();
</script>
</body>
</html>
